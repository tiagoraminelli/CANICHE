<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardia - Turnos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <style> body { background-color: #fafafa; } </style>
</head>
<body class="text-neutral-900 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

    <aside class="w-full md:w-56 bg-white border-b md:border-b-0 md:border-r border-neutral-200 flex flex-col shrink-0">
        <div class="h-14 flex items-center px-5"><span class="font-semibold text-sm tracking-wide">GUARDIA VET</span></div>
        <nav class="flex-1 p-3 space-y-1">
            <button class="tab-btn w-full text-left px-3 py-2 text-sm font-medium bg-neutral-100 text-neutral-900 rounded-md transition-colors" data-tab="listado">Turnos</button>
            <button class="tab-btn w-full text-left px-3 py-2 text-sm font-medium text-neutral-500 hover:bg-neutral-50 rounded-md transition-colors" data-tab="directorio">Directorio</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-white">
        <header class="h-14 border-b border-neutral-200 flex items-center px-6 shrink-0 justify-between">
            <h1 id="page-title" class="text-sm font-medium text-neutral-600">Turnos Agendados</h1>
            <div id="status-db" class="text-xs text-neutral-400">Conectando...</div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-10">
            
            <!-- LISTADO PRINCIPAL -->
            <div id="tab-listado" class="tab-content block max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
                        <input type="month" id="filtro-mes" class="px-3 py-2 text-sm border border-neutral-300 rounded focus:outline-none focus:border-neutral-900">
                        <input type="text" id="filtro-busqueda" placeholder="Buscar dueño o animal..." class="px-3 py-2 text-sm border border-neutral-300 rounded focus:outline-none focus:border-neutral-900 md:w-64">
                    </div>
                    <button onclick="abrirModalIngreso()" class="bg-neutral-900 hover:bg-black text-white px-4 py-2 rounded text-sm font-medium transition-colors w-full md:w-auto">
                        + Nuevo Turno
                    </button>
                </div>

                <div class="border border-neutral-200 rounded-lg overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-neutral-50 border-b border-neutral-200 text-xs uppercase text-neutral-500 font-medium">
                            <tr><th class="px-4 py-3">Fecha / Hora</th><th class="px-4 py-3">Animal</th><th class="px-4 py-3">Responsable</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-right">Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-turnos" class="divide-y divide-neutral-100 bg-white"></tbody>
                    </table>
                </div>

                <div class="flex justify-between items-center mt-4 text-sm text-neutral-600">
                    <span id="info-paginacion">Cargando...</span>
                    <div class="flex space-x-2">
                        <button id="btn-prev" onclick="cambiarPagina(-1)" class="px-3 py-1 border border-neutral-300 rounded hover:bg-neutral-50 disabled:opacity-50">Anterior</button>
                        <button id="btn-next" onclick="cambiarPagina(1)" class="px-3 py-1 border border-neutral-300 rounded hover:bg-neutral-50 disabled:opacity-50">Siguiente</button>
                    </div>
                </div>
            </div>

            <!-- DIRECTORIO -->
            <div id="tab-directorio" class="tab-content hidden max-w-5xl mx-auto">
                <div class="mb-6">
                    <input type="text" id="filtro-directorio" placeholder="Buscar persona o animal..." class="w-full px-4 py-2 text-sm border border-neutral-300 rounded focus:outline-none focus:border-neutral-900 bg-white">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3 class="text-sm font-medium mb-3">Personas</h3>
                        <div class="border border-neutral-200 rounded-lg overflow-hidden">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-neutral-50 border-b text-xs text-neutral-500">
                                    <tr>
                                        <th class="px-4 py-2 font-medium">Nombre Completo</th>
                                        <th class="px-4 py-2 font-medium">Teléfono</th>
                                        <th class="px-4 py-2 font-medium text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-personas" class="divide-y divide-neutral-100 bg-white"></tbody>
                            </table>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium mb-3">Animales</h3>
                        <div class="border border-neutral-200 rounded-lg overflow-hidden">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-neutral-50 border-b text-xs text-neutral-500">
                                    <tr><th class="px-4 py-2 font-medium">Animal</th><th class="px-4 py-2 font-medium">Dueño</th><th class="px-4 py-2 font-medium">Estado</th></tr>
                                </thead>
                                <tbody id="tabla-animales" class="divide-y divide-neutral-100 bg-white"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL NUEVO INGRESO -->
    <div id="modal-ingreso" class="fixed inset-0 bg-neutral-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-neutral-50">
                <h3 class="font-semibold">Registrar Nuevo Turno</h3>
                <button onclick="cerrarModal('modal-ingreso')" class="text-neutral-400 hover:text-neutral-600 text-xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="form-ingreso" class="space-y-6">
                    <div class="bg-neutral-50 p-4 border border-neutral-200 rounded-lg">
                        <label class="block text-xs font-medium text-neutral-600 mb-2">¿La persona ya está registrada? (Escribí para buscar)</label>
                        <input list="lista-personas" id="buscador-persona-texto" placeholder="Escribí apellido o nombre..." class="w-full px-3 py-2 text-sm border border-neutral-300 rounded focus:outline-none focus:border-neutral-900 bg-white mb-2">
                        <datalist id="lista-personas"></datalist>
                        <input type="hidden" id="buscador-persona-id">
                        
                        <div id="persona-seleccionada" class="hidden mt-2 p-2 bg-blue-50 border border-blue-200 rounded text-sm text-blue-800 flex justify-between items-center">
                            <span id="texto-persona-seleccionada"></span>
                            <button type="button" onclick="limpiarPersonaSeleccionada()" class="text-blue-500 hover:text-blue-700 text-xs font-bold">&times; Quitar</button>
                        </div>
                    </div>

                    <div id="seccion-persona" class="space-y-4 transition-opacity duration-200">
                        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider border-b pb-2">Datos del Responsable</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs text-neutral-600 mb-1">Nombre</label><input type="text" id="i-nombre" required class="w-full px-3 py-2 text-sm border rounded"></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Apellido</label><input type="text" id="i-apellido" required class="w-full px-3 py-2 text-sm border rounded"></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Teléfono</label><input type="text" id="i-telefono" required class="w-full px-3 py-2 text-sm border rounded"></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Dirección</label><input type="text" id="i-direccion" class="w-full px-3 py-2 text-sm border rounded"></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider border-b pb-2">Datos del Animal</h3>
                        <div class="grid grid-cols-3 gap-4">
                            <div><label class="block text-xs text-neutral-600 mb-1">Nombre</label><input type="text" id="i-animal-nombre" class="w-full px-3 py-2 text-sm border rounded"></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Especie</label><select id="i-especie" class="w-full px-3 py-2 text-sm border rounded"><option value="perro">Perro</option><option value="gato">Gato</option><option value="otro">Otro</option></select></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Sexo</label><select id="i-sexo" class="w-full px-3 py-2 text-sm border rounded"><option value="hembra">Hembra</option><option value="macho">Macho</option></select></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider border-b pb-2">Turno</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs text-neutral-600 mb-1">Fecha</label><input type="date" id="i-fecha" required class="w-full px-3 py-2 text-sm border rounded"></div>
                            <div><label class="block text-xs text-neutral-600 mb-1">Hora</label><input type="time" id="i-hora" required class="w-full px-3 py-2 text-sm border rounded"></div>
                        </div>
                        <div><label class="block text-xs text-neutral-600 mb-1">Observaciones</label><textarea id="i-observaciones" rows="2" class="w-full px-3 py-2 text-sm border rounded"></textarea></div>
                    </div>

                    <div class="pt-2 flex justify-end space-x-3">
                        <button type="button" onclick="cerrarModal('modal-ingreso')" class="px-4 py-2 text-sm text-neutral-600 hover:bg-neutral-100 rounded font-medium">Cancelar</button>
                        <button type="submit" id="btn-submit" class="px-4 py-2 bg-neutral-900 hover:bg-black text-white rounded text-sm font-medium">Confirmar e Ingresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL VER DETALLES -->
    <div id="modal-ver" class="fixed inset-0 bg-neutral-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-neutral-50"><h3 class="font-semibold">Detalles del Turno</h3><button onclick="cerrarModal('modal-ver')" class="text-neutral-400 hover:text-neutral-600">&times;</button></div>
            <div class="p-6 space-y-4 text-sm" id="contenido-ver"></div>
            <div class="px-6 py-4 border-t bg-neutral-50 flex justify-end"><button onclick="cerrarModal('modal-ver')" class="px-4 py-2 bg-neutral-900 text-white rounded text-sm font-medium">Cerrar</button></div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div id="modal-editar" class="fixed inset-0 bg-neutral-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-neutral-50"><h3 class="font-semibold">Editar Turno</h3><button onclick="cerrarModal('modal-editar')" class="text-neutral-400 hover:text-neutral-600">&times;</button></div>
            <form id="form-editar" class="p-6 space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs font-medium text-neutral-600 mb-1">Fecha</label><input type="date" id="edit-fecha" required class="w-full px-3 py-2 text-sm border rounded"></div>
                    <div><label class="block text-xs font-medium text-neutral-600 mb-1">Hora</label><input type="time" id="edit-hora" required class="w-full px-3 py-2 text-sm border rounded"></div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">Estado</label>
                    <select id="edit-estado" class="w-full px-3 py-2 text-sm border rounded">
                        <option value="pendiente">Pendiente</option>
                        <option value="asistio">Asistió (Castrado)</option>
                        <option value="cancelado">Cancelado</option>
                        <option value="ausente">Ausente</option>
                    </select>
                </div>
                <div><label class="block text-xs font-medium text-neutral-600 mb-1">Observaciones</label><textarea id="edit-observaciones" rows="2" class="w-full px-3 py-2 text-sm border rounded"></textarea></div>
                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="cerrarModal('modal-editar')" class="px-4 py-2 text-sm text-neutral-600 hover:bg-neutral-100 rounded font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-neutral-900 hover:bg-black text-white rounded text-sm font-medium">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/app.js" type="module"></script>
</body>
</html>
