<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castraciones App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#111827', surface: '#F9FAFB' } } } }
    </script>
</head>
<body class="flex h-screen bg-white text-gray-800 font-sans overflow-hidden">

    <nav class="w-64 bg-white border-r border-gray-100 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <svg class="w-5 h-5 text-brand mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <span class="font-semibold text-lg tracking-tight">Castraciones</span>
        </div>
        <ul class="flex-1 py-4 px-3 space-y-1">
            <li class="active" onclick="cambiarVista('listado', event)">
                <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-brand bg-gray-50 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg> Listado General
                </button>
            </li>
            <li onclick="cambiarVista('formulario', event)">
                <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-brand transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> <span id="menu-form-texto">Nueva Carga</span>
                </button>
            </li>
        </ul>
    </nav>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 md:px-8 shrink-0">
            <h2 id="titulo-vista" class="text-lg font-semibold tracking-tight text-brand">Listado General</h2>
            <button id="btnActualizar" class="flex items-center gap-2 text-sm font-medium text-gray-400 hover:text-brand transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span class="hidden md:inline">Actualizar</span>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            
            <section id="vista-listado" class="vista block max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row gap-4 mb-6">
                    <input type="text" id="buscador" placeholder="Buscar por nombre o dirección..." class="flex-1 px-4 py-2 border-b border-gray-200 focus:border-brand outline-none text-sm bg-transparent transition-colors">
                    <select id="filtro-estado" class="px-4 py-2 border-b border-gray-200 focus:border-brand outline-none text-sm bg-transparent transition-colors text-gray-600">
                        <option value="todos">Todos los estados</option>
                        <option value="si">Confirmados</option>
                        <option value="no">No confirmaron / Rechazados</option>
                        <option value="pendiente">Pendientes</option>
                    </select>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                <th class="py-3 px-4">Nombre y Dirección</th>
                                <th class="py-3 px-4">Teléfono</th>
                                <th class="py-3 px-4 text-center">Can / Fel / Otros</th>
                                <th class="py-3 px-4 text-center">H / M</th>
                                <th class="py-3 px-4">Estado</th>
                                <th class="py-3 px-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-registros" class="text-sm divide-y divide-gray-50"></tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-100 text-sm text-gray-500">
                    <span id="info-paginacion">Mostrando 0 de 0 registros</span>
                    <div class="flex gap-2">
                        <button id="btn-prev" class="px-3 py-1 hover:text-brand disabled:opacity-30 disabled:hover:text-gray-500 transition-colors">Anterior</button>
                        <button id="btn-next" class="px-3 py-1 hover:text-brand disabled:opacity-30 disabled:hover:text-gray-500 transition-colors">Siguiente</button>
                    </div>
                </div>
            </section>

            <section id="vista-formulario" class="vista hidden max-w-2xl mx-auto pb-10">
                <form id="formCastracion" class="space-y-6">
                    <input type="hidden" id="edit-row" value="">
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Manzana</label>
                            <input type="text" id="manzana" class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Dirección *</label>
                            <input type="text" id="direccion" required class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Nombre y Apellido *</label>
                            <input type="text" id="nombre" required class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Teléfono</label>
                            <input type="tel" id="telefono" class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-6 bg-gray-50 p-3 rounded">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Caninos</label>
                            <input type="number" id="caninos" min="0" value="0" class="w-full px-0 py-2 border-b border-gray-300 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Felinos</label>
                            <input type="number" id="felinos" min="0" value="0" class="w-full px-0 py-2 border-b border-gray-300 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Otros</label>
                            <input type="number" id="otros" min="0" value="0" class="w-full px-0 py-2 border-b border-gray-300 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6 bg-gray-50 p-3 rounded">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">N° Hembras</label>
                            <input type="number" id="hembras" min="0" value="0" class="w-full px-0 py-2 border-b border-gray-300 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">N° Machos</label>
                            <input type="number" id="machos" min="0" value="0" class="w-full px-0 py-2 border-b border-gray-300 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Observaciones</label>
                        <textarea id="observaciones" rows="2" class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent resize-none"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Turno</label>
                            <input type="text" id="turno" placeholder="Ej: 8.30hs" class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Estado</label>
                            <select id="confirmo" class="w-full px-0 py-2 border-b border-gray-200 focus:border-brand outline-none transition-colors text-sm bg-transparent">
                                <option value="Si">Confirmado (Sí)</option>
                                <option value="No">Rechazado (No)</option>
                                <option value="Pendiente">Pendiente</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Firma (Solo si es nueva)</label>
                        <div class="relative border-b border-gray-200 h-24 bg-transparent overflow-hidden group">
                            <canvas id="firmaCanvas" class="w-full h-full cursor-crosshair"></canvas>
                            <button type="button" id="limpiarFirma" class="absolute bottom-1 right-0 text-gray-400 hover:text-brand transition-colors text-xs">Borrar firma</button>
                        </div>
                    </div>
                    
                    <div class="flex gap-4 pt-4">
                        <button type="button" onclick="cambiarVista('listado', {currentTarget: document.querySelector('.nav-links li:first-child')})" class="w-1/3 border border-gray-200 text-gray-600 font-medium py-2.5 rounded hover:bg-gray-50 transition-colors">Cancelar</button>
                        <button type="submit" id="btn-guardar" class="w-2/3 bg-brand text-white font-medium py-2.5 rounded hover:bg-gray-800 transition-colors flex justify-center items-center gap-2">Guardar Registro</button>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
